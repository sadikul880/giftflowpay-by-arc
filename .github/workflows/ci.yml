name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint:ci
      - run: bun test src
      - name: Production build (same 1.28 GB heap cap as the Docker image)
        run: node --max-old-space-size=1280 node_modules/vite/bin/vite.js build
        env:
          VITE_GIFTFLOW_ADDRESS_TESTNET: "0xa4b97bda0785ab417d0cce128a9fb9449139ee2c"

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: bun install --frozen-lockfile
      - run: forge test

  local-chain-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: bun install --frozen-lockfile
      - name: Start Anvil and deploy
        run: |
          anvil --silent &
          for i in $(seq 1 30); do cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 && break; sleep 1; done
          # Anvil's public dev key: fake ETH on a throwaway local chain.
          forge script contracts/script/DeployLocal.s.sol:DeployLocal --rpc-url http://127.0.0.1:8545 --broadcast --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - run: bun test contracts/test-integration/local-chain.test.ts
